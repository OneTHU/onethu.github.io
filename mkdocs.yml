site_name: OneTHU 文档
site_description: OneTHU 0.11 使用指南、开发者资料、插件 API 与历史记录
site_url: https://onethu.github.io/docs/
docs_dir: docs-src
site_dir: site
theme:
  name: material
  language: zh
  custom_dir: overrides
  logo: assets/favicon.png
  favicon: assets/favicon.png
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
markdown_extensions:
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: {case: lower}
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - assets/extra.css
extra_javascript:
  - assets/language.js
plugins:
  - search:
      lang: [zh, en]
validation:
  links:
    absolute_links: ignore
    unrecognized_links: ignore
exclude_docs: |
  en/
extra:
  generator: false
  alternate:
    - name: 中文
      link: https://onethu.github.io/docs/
      lang: zh
    - name: English
      link: https://onethu.github.io/docs/en/
      lang: en
nav:
  - 使用:
      - 文档首页: index.md
      - 安装与上手: getting-started.md
      - 三种模式: experience-modes.md
      - 白板与快捷入口: workbench.md
      - 暂存、口令与组织: sharing-and-organizations.md
      - 日程、作业与同步: schedule-and-sync.md
      - 搜索、OH 与清小搭: oh-and-xiaoda.md
      - 隐私与排障: privacy-and-troubleshooting.md
      - 0.11.4 CLI 与应用能力: release-0.11.4.md
      - CLI 与常驻后台: onethu-cli.md
      - OH 应用服务: oh-app-services.md
      - 0.11.3 登录修复: release-0.11.3.md
      - 0.11.2 修复: release-0.11.2.md
      - 0.11.1 修复: release-0.11.1.md
      - 0.11 说明: release-0.11.md
  - 开发者:
      - 开发者中心: developers.md
      - 贡献者: contributors.md
      - 系统架构: architecture.md
      - 插件开发: plugin-development.md
      - API 使用约定: api-reference.md
      - 完整 API 清单: api-surface.md
      - OneGUI: design-language.md
      - 开发构建: dev-build.md
      - Android 构建排障: android-release-traps.md
      - 模拟素材来源: screenshots.md
      - 翻译交接指南: i18n/TRANSLATOR_GUIDE.md
      - 翻译术语: i18n/GLOSSARY.md
      - Rust 插件骨架: examples/harness-skel/README.md
  - 工程参考:
      - 作业聚合: homework.md
      - 外部作业源: external-homework.md
      - 令牌入口: tokens-map.md
      - 动效规范: 动效设计规范.md
      - 组件尺寸: 白板组件尺寸档清单.md
      - 入口映射: 入口映射表.md
  - 全量记录:
      - 文档清单与历史状态: documentation-catalog.md
      - 许可与致谢: license.md
  - 官网: https://onethu.github.io/
